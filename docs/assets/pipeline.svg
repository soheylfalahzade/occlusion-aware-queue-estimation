<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 150" width="910" height="150" role="img" aria-label="occlusion-aware lane-level queue estimation">
<rect x="1" y="1" width="908" height="148" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker></defs>
<rect x="20" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="0.00s" repeatCount="indefinite"/></rect>
<text x="80.0" y="77.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Detector + tracker</text>
<line x1="140" y1="73.0" x2="168" y2="73.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="170" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="1.17s" repeatCount="indefinite"/></rect>
<text x="230.0" y="69.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Homography</text>
<text x="230.0" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">(ground plane)</text>
<line x1="290" y1="73.0" x2="318" y2="73.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="320" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="2.33s" repeatCount="indefinite"/></rect>
<text x="380.0" y="69.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Track kinematics</text>
<text x="380.0" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">+ ghosts</text>
<line x1="440" y1="73.0" x2="468" y2="73.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="470" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="3.50s" repeatCount="indefinite"/></rect>
<text x="530.0" y="69.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Occlusion model</text>
<text x="530.0" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">(ray casting)</text>
<line x1="590" y1="73.0" x2="618" y2="73.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="620" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="4.67s" repeatCount="indefinite"/></rect>
<text x="680.0" y="69.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Queue observer</text>
<text x="680.0" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">(chain, gaps, tail)</text>
<line x1="740" y1="73.0" x2="768" y2="73.0" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="770" y="45" width="120" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"><animate attributeName="fill" values="#f6f8fa;#ddf4ff;#f6f8fa;#f6f8fa" keyTimes="0;0.083;0.200;1" dur="7.0s" begin="5.83s" repeatCount="indefinite"/></rect>
<text x="830.0" y="69.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">Kalman filter</text>
<text x="830.0" y="84.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#24292f">+ confidence</text>
<circle r="6" fill="#d62728" opacity="0.9"><animateMotion dur="7.0s" repeatCount="indefinite" path="M40,73 L890,73"/></circle>
<text x="455" y="24" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#57606a">occlusion-aware lane-level queue estimation</text>
<text x="455" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">lane estimate: queue length, count, 95% interval, confidence, max-pressure and fuzzy inputs</text>
</svg>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-aware-queue-estimation"
version = "0.1.0"
description = "Occlusion-aware lane-level queue and max-pressure estimation from oblique roadside cameras"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "soheylfalahzade" }]
keywords = ["intelligent-transportation-systems", "traffic-signal-control", "computer-vision", "queue-estimation", "max-pressure"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8", "ultralytics>=8.3"]
sumo = ["eclipse-sumo", "traci"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
oaqe-benchmark = "oaqe.evaluation.benchmark:main"
oaqe-video = "oaqe.cli:main_video"
oaqe-sumo = "oaqe.sim.sumo_bridge:main"
oaqe-gif = "oaqe.viz:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oaqe = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
